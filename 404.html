<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineMemo - 页面未找到</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #6C5CE7 0%, #A29BFE 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      text-align: center;
      color: white;
      max-width: 600px;
    }
    
    .error-code {
      font-size: 120px;
      font-weight: 700;
      opacity: 0.9;
      line-height: 1;
      margin-bottom: 20px;
      font-family: 'Playfair Display', serif;
    }
    
    .error-title {
      font-size: 32px;
      margin-bottom: 16px;
    }
    
    .error-message {
      font-size: 18px;
      opacity: 0.9;
      margin-bottom: 40px;
      line-height: 1.6;
    }
    
    .home-link {
      display: inline-block;
      padding: 14px 32px;
      background: white;
      color: #6C5CE7;
      text-decoration: none;
      border-radius: 30px;
      font-weight: 500;
      font-size: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .home-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }
    
    .emoji {
      font-size: 64px;
      margin-bottom: 20px;
    }
    
    @media (max-width: 480px) {
      .error-code {
        font-size: 80px;
      }
      
      .error-title {
        font-size: 24px;
      }
      
      .error-message {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">🎬</div>
    <div class="error-code">404</div>
    <h1 class="error-title">页面未找到</h1>
    <p class="error-message">
      抱歉，你访问的页面不存在。<br>
      可能是链接错误或页面已移动。
    </p>
    <a href="/" class="home-link">返回首页</a>
  </div>
</body>
</html>
