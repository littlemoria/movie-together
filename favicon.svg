<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C5CE7"/>
      <stop offset="100%" style="stop-color:#A29BFE"/>
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  
  <!-- Film Reel Inner Circle -->
  <circle cx="50" cy="50" r="15" fill="#FFFFFF"/>
  
  <!-- Film Reel Holes -->
  <circle cx="50" cy="38" r="3" fill="url(#bg)"/>
  <circle cx="39.5" cy="44" r="3" fill="url(#bg)"/>
  <circle cx="60.5" cy="44" r="3" fill="url(#bg)"/>
  <circle cx="39.5" cy="56" r="3" fill="url(#bg)"/>
  <circle cx="60.5" cy="56" r="3" fill="url(#bg)"/>
  
  <!-- Film Strip Lines -->
  <rect x="8" y="20" width="8" height="60" rx="2" fill="#FFFFFF" opacity="0.9"/>
  <rect x="84" y="20" width="8" height="60" rx="2" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Decorative Dots on Film Strip -->
  <circle cx="12" cy="28" r="1.5" fill="url(#bg)"/>
  <circle cx="12" cy="40" r="1.5" fill="url(#bg)"/>
  <circle cx="12" cy="52" r="1.5" fill="url(#bg)"/>
  <circle cx="12" cy="64" r="1.5" fill="url(#bg)"/>
  <circle cx="88" cy="28" r="1.5" fill="url(#bg)"/>
  <circle cx="88" cy="40" r="1.5" fill="url(#bg)"/>
  <circle cx="88" cy="52" r="1.5" fill="url(#bg)"/>
  <circle cx="88" cy="64" r="1.5" fill="url(#bg)"/>
</svg>
